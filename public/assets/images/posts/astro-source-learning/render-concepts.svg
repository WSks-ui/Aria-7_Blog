<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FCD34D"/>
    </marker>
    <style>
      .title { fill: #F8FAFC; font: 700 34px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .subtitle { fill: #E5E7EB; font: 500 18px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .h { fill: #F8FAFC; font: 700 22px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .t { fill: #E5E7EB; font: 500 16px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .s { fill: #D1D5DB; font: 500 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" class="title">SSR、岛屿架构与 hydrate 的关系</text>
  <text x="60" y="106" class="subtitle">三个概念关注的不是同一层：HTML 在哪生成、JS 给谁加载、交互何时接上</text>

  <rect x="70" y="170" width="300" height="220" rx="24" fill="#0F172A" stroke="#374151"/>
  <text x="105" y="215" class="h">SSR</text>
  <text x="105" y="255" class="t">关注点：</text>
  <text x="105" y="288" class="t">HTML 在服务器生成</text>
  <text x="105" y="321" class="t">再发给浏览器</text>
  <text x="105" y="366" class="s">回答的问题：页面内容先在哪里拼好？</text>

  <rect x="450" y="170" width="300" height="220" rx="24" fill="#0F172A" stroke="#374151"/>
  <text x="485" y="215" class="h">岛屿架构</text>
  <text x="485" y="255" class="t">关注点：</text>
  <text x="485" y="288" class="t">只给局部交互组件加载 JS</text>
  <text x="485" y="321" class="t">而不是整页都接管</text>
  <text x="485" y="366" class="s">回答的问题：哪些区域需要变成“活的”？</text>

  <rect x="830" y="170" width="300" height="220" rx="24" fill="#0F172A" stroke="#374151"/>
  <text x="865" y="215" class="h">hydrate</text>
  <text x="865" y="255" class="t">关注点：</text>
  <text x="865" y="288" class="t">把已有 HTML 接上 JS 逻辑</text>
  <text x="865" y="321" class="t">让组件变得可交互</text>
  <text x="865" y="366" class="s">回答的问题：静态内容如何“活过来”？</text>

  <path d="M370 280H450" stroke="#FCD34D" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 280H830" stroke="#FCD34D" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="100" y="470" width="1000" height="250" rx="24" fill="#0B1220" stroke="#374151"/>
  <text x="135" y="515" class="h">一个博客文章页的直观拆分</text>

  <rect x="150" y="555" width="170" height="82" rx="18" fill="#1E293B" stroke="#475569"/>
  <text x="204" y="605" class="t">标题</text>
  <rect x="350" y="555" width="220" height="82" rx="18" fill="#1E293B" stroke="#475569"/>
  <text x="442" y="605" class="t">正文</text>
  <rect x="600" y="555" width="170" height="82" rx="18" fill="#0F766E" fill-opacity="0.22" stroke="#2DD4BF"/>
  <text x="648" y="593" class="t">评论框</text>
  <text x="633" y="617" class="s">岛屿：需要 JS</text>
  <rect x="800" y="555" width="170" height="82" rx="18" fill="#0F766E" fill-opacity="0.22" stroke="#2DD4BF"/>
  <text x="848" y="593" class="t">搜索框</text>
  <text x="833" y="617" class="s">岛屿：需要 JS</text>

  <text x="150" y="680" class="s">大部分页面内容只是静态 HTML；只有少数交互组件会在浏览器里 hydrate。</text>
</svg>
