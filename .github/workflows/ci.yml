name: 持续集成

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 审计、检查与浏览器测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查高危依赖漏洞
        run: npm audit --audit-level=high

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: Astro 与 TypeScript 检查
        run: npm run check

      - name: 运行单元测试
        run: npm run test:unit

      - name: 构建生产站点
        run: npm run build

      - name: 检查内部链接与静态资源
        run: npm run check:links

      - name: 检查构建性能预算
        run: npm run check:performance

      - name: 运行 Lighthouse 移动端门禁
        run: npm run test:lighthouse

      - name: 运行端到端测试
        run: npm run test:e2e:ci

      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  production-probe:
    name: 生产部署探针
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://aria7bl0g.pages.dev
      EXPECTED_SHA: ${{ github.sha }}

    steps:
      - name: 检出代码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 等待并验证 Cloudflare Pages 部署
        run: npm run verify:production
